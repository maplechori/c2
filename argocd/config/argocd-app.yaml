apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-config
  namespace: default
spec:
  project: default
  source:
    repoURL: 'https://github.com/maplechori/c2'
    targetRevision: HEAD
    path: 'argocd/app'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  